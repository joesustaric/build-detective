<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>

  <!-- Passing node (left, green) -->
  <circle cx="22" cy="64" r="13" fill="#00d26a"/>

  <!-- Connector line: passing → failed -->
  <line x1="35" y1="64" x2="51" y2="64" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Failed node (centre, red) -->
  <circle cx="64" cy="64" r="13" fill="#ff4d6d"/>
  <!-- X mark on failed node -->
  <line x1="57" y1="57" x2="71" y2="71" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="71" y1="57" x2="57" y2="71" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Connector line: failed → not-run -->
  <line x1="77" y1="64" x2="93" y2="64" stroke="#4a4a6a" stroke-width="3"/>

  <!-- Not-yet-run node (right, grey) -->
  <circle cx="106" cy="64" r="13" fill="#4a4a6a"/>

  <!-- Magnifying glass ring, centred on failed node -->
  <circle cx="64" cy="64" r="22" fill="none" stroke="#7b61ff" stroke-width="4"/>
  <!-- Magnifying glass handle -->
  <line x1="80" y1="80" x2="94" y2="94" stroke="#7b61ff" stroke-width="5" stroke-linecap="round"/>
</svg>
