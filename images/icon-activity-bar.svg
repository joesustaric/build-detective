<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Mask cuts the X out of the failed node circle -->
    <mask id="x-cutout">
      <rect width="24" height="24" fill="white"/>
      <line x1="10.2" y1="10.2" x2="13.8" y2="13.8" stroke="black" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="13.8" y1="10.2" x2="10.2" y2="13.8" stroke="black" stroke-width="1.3" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Passing node (left) -->
  <circle cx="5" cy="12" r="2.5" fill="currentColor"/>

  <!-- Connector: passing → failed -->
  <line x1="7.5" y1="12" x2="9.5" y2="12" stroke="currentColor" stroke-width="1.5"/>

  <!-- Failed node (centre) — circle with X cut out via mask -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor" mask="url(#x-cutout)"/>

  <!-- Connector: failed → not-run -->
  <line x1="14.5" y1="12" x2="16.5" y2="12" stroke="currentColor" stroke-width="1.5"/>

  <!-- Not-yet-run node (right) -->
  <circle cx="19" cy="12" r="2.5" fill="currentColor"/>

  <!-- Magnifying glass ring -->
  <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- Magnifying glass handle — stroke-width=2 (slightly heavier than ring) for legibility at small sizes -->
  <line x1="15.2" y1="15.2" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
